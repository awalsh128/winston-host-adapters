name: Docs

# Rebuilds the API docs and deploys them to GitHub Pages without releasing anything. Run it from main
# when only the docs changed (for example the landing page in scripts/docs-index.mjs), since a `docs:`
# commit releases nothing and publish.yml deploys the docs only after a release.
#
# Holds no npm or tag credentials: the only token is the Pages deployment's.
on:
  workflow_dispatch:

permissions: {}

jobs:
  build:
    # The github-pages environment only allows main.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read # For checking CI results
      contents: read
      pages: read # For configure-pages to read the Pages site settings
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5, Node 24
        with:
          persist-credentials: false

      - name: Require CI success
        uses: ./.github/actions/require-ci-success
        with:
          sha: ${{ github.sha }}
          token: ${{ github.token }}

      - name: Setup
        uses: ./.github/actions/setup
        with:
          ignore-scripts: true

      # Packages import each other through their dist/, so they build before the docs do.
      - name: Build
        run: npm run build

      - name: Build API docs
        run: npm run docs:api

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/api

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write # For GitHub Pages deployment
      id-token: write # For OIDC verification of the Pages deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
